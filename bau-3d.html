<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baú 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#5d636c 0%,#3a3e45 60%,#2a2d33 100%);font-family:system-ui,sans-serif}
  canvas{display:block}
  .ui{position:fixed;left:16px;bottom:16px;display:flex;gap:8px}
  .ui button{background:#1e2127cc;color:#e8e3d6;border:1px solid #555b64;border-radius:6px;padding:8px 12px;font-size:14px;cursor:pointer}
  .ui button:hover{background:#2b2f37}
  .hint{position:fixed;left:16px;top:16px;color:#c9c4b8;font-size:13px;opacity:.75}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div class="hint">Arraste para girar · clique no baú para abrir/fechar</div>
<div class="ui">
  <button id="btnOpen">Abrir / Fechar</button>
  <button id="btnExplode">Explodir</button>
  <button id="btnSpin">Girar</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- Reconstruction data (1 unit = 1 texel of a 16px block) ----
const SPEC = {
  base:  { size: [14, 10, 14], pos: [0, 5, 0] },          // y 0..10
  lid:   { size: [14, 5, 14],  hingeY: 9, hingeZ: -7 },     // y 9..14, hinge on rear-top edge
  latch: { size: [2, 4, 1],    pos: [0, 9, 7.5] },          // y 7..11, spans seam, 1px proud
  res: 2, // texels per model unit (reference grain is ~2x the 16px grid)
  wood:  ['#6f5a0c', '#86680f', '#9a6a12', '#b0741a', '#c4801c', '#d4952e'],
  frame: '#2b2114',
  frameInner: '#46371f',
  cavity: ['#3a2a0e', '#4a3512', '#563e16'],
  latchPx: ['#e4e4e4', '#c6c6c6', '#9a9a9a', '#6c6c6c'],
};

// Deterministic PRNG so the pixel pattern is stable between loads.
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// Pixel-art plank grain: horizontal runs whose shade drifts diagonally row to row.
function woodPixels(w, h, seed, palette = SPEC.wood) {
  const r = rng(seed), px = [];
  let prev = [];
  for (let y = 0; y < h; y++) {
    const row = [];
    let x = 0;
    while (x < w) {
      const run = 2 + Math.floor(r() * 4);
      const ref = prev[Math.min(w - 1, x + 1)] ?? 3;
      let idx = Math.round(ref + (r() * 3 - 1.5));
      idx = Math.max(0, Math.min(palette.length - 1, idx));
      if (r() < 0.25) idx = 1 + Math.floor(r() * (palette.length - 2));
      for (let i = 0; i < run && x < w; i++, x++) row.push(idx);
    }
    px.push(row.map(i => palette[i]));
    prev = row;
  }
  return px;
}

function makeTexture(w, h, seed, opts = {}) {
  w *= SPEC.res; h *= SPEC.res;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const px = woodPixels(w, h, seed, opts.palette);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { g.fillStyle = px[y][x]; g.fillRect(x, y, 1, 1); }
  if (opts.border !== false) {
    // 1px dark frame on every edge, lighter bevel just inside
    g.fillStyle = SPEC.frameInner;
    g.fillRect(1, 1, w - 2, 1); g.fillRect(1, h - 2, w - 2, 1); g.fillRect(1, 1, 1, h - 2); g.fillRect(w - 2, 1, 1, h - 2);
    g.fillStyle = SPEC.frame;
    g.fillRect(0, 0, w, 1); g.fillRect(0, h - 1, w, 1); g.fillRect(0, 0, 1, h); g.fillRect(w - 1, 0, 1, h);
  }
  if (opts.innerFrame) {
    // cavity face: 1px wall rim then dark interior
    const cav = woodPixels(w - 2, h - 2, seed + 7, SPEC.cavity);
    for (let y = 0; y < h - 2; y++) for (let x = 0; x < w - 2; x++) { g.fillStyle = cav[y][x]; g.fillRect(x + 1, y + 1, 1, 1); }
    g.fillStyle = SPEC.frame;
    g.fillRect(0, 0, w, 1); g.fillRect(0, h - 1, w, 1); g.fillRect(0, 0, 1, h); g.fillRect(w - 1, 0, 1, h);
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function latchTexture(w, h) {
  const c = document.createElement('canvas'); c.width = w * 2; c.height = h * 2;
  const g = c.getContext('2d'), P = SPEC.latchPx;
  // 4x8 sub-pixel latch: bright left column, shaded right, dark lower lip
  for (let y = 0; y < h * 2; y++) for (let x = 0; x < w * 2; x++) {
    let col = x < 2 ? (x === 0 ? P[1] : P[0]) : P[2];
    if (y >= h * 2 - 2) col = x < 2 ? P[2] : P[3];
    if (y === 0) col = P[1];
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const mat = (map) => new THREE.MeshLambertMaterial({ map });

// BoxGeometry face order: +X, -X, +Y, -Y, +Z, -Z
function boxMaterials([w, h, d], seed, { top, bottom } = {}) {
  return [
    mat(makeTexture(d, h, seed + 1)),
    mat(makeTexture(d, h, seed + 2)),
    mat(top ?? makeTexture(w, d, seed + 3)),
    mat(bottom ?? makeTexture(w, d, seed + 4)),
    mat(makeTexture(w, h, seed + 5)),
    mat(makeTexture(w, h, seed + 6)),
  ];
}

function createChestModel(spec = SPEC) {
  const root = new THREE.Group(); root.name = 'chest';

  const base = new THREE.Mesh(
    new THREE.BoxGeometry(...spec.base.size),
    boxMaterials(spec.base.size, 100, { top: makeTexture(14, 14, 130, { border: false, innerFrame: true }) }),
  );
  base.name = 'base'; base.position.set(...spec.base.pos);
  root.add(base);

  // Lid pivots on the rear-top hinge so it can open like the real thing.
  const lidPivot = new THREE.Group(); lidPivot.name = 'lidPivot';
  lidPivot.position.set(0, spec.lid.hingeY, spec.lid.hingeZ);
  const [lw, lh, ld] = spec.lid.size;
  const lid = new THREE.Mesh(
    new THREE.BoxGeometry(lw, lh, ld),
    boxMaterials(spec.lid.size, 200, { bottom: makeTexture(14, 14, 230, { border: false, innerFrame: true }) }),
  );
  lid.name = 'lid'; lid.position.set(0, lh / 2, ld / 2);
  lidPivot.add(lid);

  const latch = new THREE.Mesh(new THREE.BoxGeometry(...spec.latch.size), new THREE.MeshLambertMaterial({ map: latchTexture(2, 4) }));
  latch.name = 'latch';
  // latch is parented to the lid so it rides along when opened
  latch.position.set(spec.latch.pos[0], spec.latch.pos[1] - spec.lid.hingeY, spec.latch.pos[2] - spec.lid.hingeZ);
  lidPivot.add(latch);
  root.add(lidPivot);

  root.userData = { base, lidPivot, lid, latch };
  return root;
}

// ---- Scene ----
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(18, innerWidth / innerHeight, 1, 800);
camera.position.set(-54, 60, 54);

const chest = createChestModel();
chest.position.y = -7;
chest.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(chest);

// Soft contact shadow on an invisible floor
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0.28 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -7.01; floor.receiveShadow = true;
scene.add(floor);

scene.add(new THREE.HemisphereLight(0xffffff, 0x6a6f78, 1.9));
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(-6, 40, 14); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 });
key.shadow.radius = 6;
scene.add(key);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 0, 0);
controls.minDistance = 35; controls.maxDistance = 200;

// ---- Interaction ----
const { lidPivot, base, latch } = chest.userData;
const q = new URLSearchParams(location.search);
let open = q.has('open'), openT = 0, exploded = q.has('explode'), explodeT = 0, spin = q.has('spin');
if (q.has('yaw')) chest.rotation.y = THREE.MathUtils.degToRad(+q.get('yaw'));
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  if (ray.intersectObject(chest, true).length) open = !open;
});
document.getElementById('btnOpen').onclick = () => { open = !open; };
document.getElementById('btnExplode').onclick = () => { exploded = !exploded; };
document.getElementById('btnSpin').onclick = () => { spin = !spin; };

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const lidBaseY = lidPivot.position.y, latchBaseZ = latch.position.z;
const ease = t => t * t * (3 - 2 * t);
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  openT = THREE.MathUtils.clamp(openT + (open ? dt : -dt) * 2.5, 0, 1);
  explodeT = THREE.MathUtils.clamp(explodeT + (exploded ? dt : -dt) * 2.5, 0, 1);
  lidPivot.rotation.x = -ease(openT) * THREE.MathUtils.degToRad(80);
  const e = ease(explodeT);
  lidPivot.position.y = lidBaseY + e * 8;
  latch.position.z = latchBaseZ + e * 4;
  base.position.y = 5 - e * 2;
  if (spin) chest.rotation.y += dt * 0.6;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
