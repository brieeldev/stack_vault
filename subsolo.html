 <div class="full"></div>
</div>

<script>

// Mundo procedural em blocos 16x16: camadas por altura Y (63 no topo até -64 no fundo),
// ardósia (deepslate) só abaixo de Y 0, minérios por camada, cavernas, aquíferos, cavernas de musgo e geodos.
(()=>{
const hero=document.querySelector('.hero'),wrap=document.querySelector('.wrap');if(!hero||!wrap)return;

// ═══ AJUSTES — mude aqui para personalizar o subsolo ═══
const CFG={
 TILE:32,          // tamanho de cada bloco na tela (px); igual ao --grass-tile da faixa de grama
 SEED:1337,        // semente do mundo: troque para gerar outro subsolo
 Y_TOP:62,         // altura Y logo abaixo da grama
 Y_BOTTOM:-64,     // altura Y no fim da página (fundo do mundo, bedrock)
 DEEPSLATE_MIX:0,  // transição pedra/ardósia acima de Y 0 (0 = corte seco em Y 0; 8 = como no jogo, mistura de Y 0 a 8)
 DIRT_DEPTH:2,     // camadas de terra logo abaixo da grama
 // Cavernas: CHEESE = bolsões grandes (maior = menos cavernas); SPAGHETTI = túneis finos (maior = túneis mais largos)
 CHEESE:.64, SPAGHETTI:.028,
 FLOOD:.45,        // chance de uma região de caverna estar inundada (água; abaixo de Y -54 vira lava)
 LAVA_Y:-54,       // abaixo disso os aquíferos são de lava
 LUSH:.6,          // limiar das cavernas de musgo (menor = mais cavernas verdes)
 GEODE_EVERY:2000, // 1 geodo a cada ~N blocos (menor = mais geodos)
 BLOBS:.7,         // limiar das manchas de granito/diorito/andesito/tufo/terra/cascalho (menor = manchas maiores)
 ORE_RATE:1,       // multiplicador de minérios (2 = o dobro)
 CAVE_DARK:.78,    // escuridão do fundo das cavernas (0 = claro, 1 = preto)
 WATER_ALPHA:.85,  // opacidade da água sobre o fundo da caverna
 DIM_TOP:.42,      // véu escuro sobre o mundo para o conteúdo ficar legível (topo)...
 DIM_BOTTOM:.6,    // ...e no fundo da página
 CHUNK_ROWS:48,    // linhas de blocos por canvas (o mundo é desenhado em pedaços, só perto da tela)

// ── Ruído determinístico ──
const hash=(x,y,s=0)=>{let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul((s+CFG.SEED)|0,2147483647);h=Math.imul(h^h>>>13,1274126177);h^=h>>>16;return(h>>>0)/4294967296};
const lerp=(a,b,t)=>a+(b-a)*t,fade=t=>t*t*(3-2*t);
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=fade(x-xi),yf=fade(y-yi);
 return lerp(lerp(hash(xi,yi,s),hash(xi+1,yi,s),xf),lerp(hash(xi,yi+1,s),hash(xi+1,yi+1,s),xf),yf)}
const fbm=(x,y,s)=>(vnoise(x,y,s)*.6+vnoise(x*2.1,y*2.1,s+7)*.28+vnoise(x*4.3,y*4.3,s+13)*.12);
const clamp01=v=>v<0?0:v>1?1:v,tri=(y,a,b,p)=>y<a||y>b?0:y<p?(y-a)/(p-a):(b-y)/(b-p);

let rows=0,yOf=r=>0,geodes=new Map();
// Peso de cada minério por altura Y (forma aproximada da distribuição real 1.18+)
const ORES=[
 ['coal',     y=>y<0?0:.5+.6*clamp01(y/60)],
 ['copper',   y=>tri(y,-16,112,48)*.9],
 ['iron',     y=>tri(y,-24,56,16)*.9+(y<56?.12:0)],
 ['lapis',    y=>tri(y,-32,32,0)*.45+.06],
 ['gold',     y=>tri(y,-64,32,-16)*.55],
 ['redstone', y=>y>15?0:.25+.55*clamp01((-20-y)/44)],
 ['diamond',  y=>y>16?0:.15+.55*clamp01((-30-y)/34)],
];
function oreAt(c,r,y){
 const G=5,gx=Math.floor(c/G),gy=Math.floor(r/G),cy=yOf(gy*G+2);
 let tot=2.4/CFG.ORE_RATE;const w=ORES.map(([n,f])=>{const v=f(cy);tot+=v;return v});
 let pick=hash(gx,gy,101)*tot,ore=null;for(let i=0;i<w.length;i++){if(pick<w[i]){ore=ORES[i][0];break}pick-=w[i]}
 if(!ore)return null;
 const ox=gx*G+1.5+hash(gx,gy,102)*2,oy=gy*G+1.5+hash(gx,gy,103)*2,rad=.9+hash(gx,gy,104)*(ore==='diamond'?.6:1);
 return Math.hypot(c-ox,(r-oy)*1.15)<rad*(.75+.5*hash(c,r,105))?ore:null}
// Geodos: anel de basalto liso, calcita, ametista e miolo oco
function placeGeodes(cols){geodes=new Map();const n=Math.max(1,Math.round(cols*rows/CFG.GEODE_EVERY));
 for(let i=0;i<n;i++){const c=Math.floor(hash(i,1,201)*cols),R=4.5+hash(i,2,202)*2.5;let r=0,tries=0;
  do{r=Math.floor(hash(i,3+tries,203)*rows);tries++}while(!(yOf(r)<25&&yOf(r)>-56)&&tries<20);
  const g={c,r,R,sq:.8+hash(i,4,204)*.35};for(let gx=Math.floor((c-R)/16);gx<=Math.floor((c+R)/16);gx++)for(let gy=Math.floor((r-R)/16);gy<=Math.floor((r+R)/16);gy++){const k=gx+','+gy;(geodes.get(k)||geodes.set(k,[]).get(k)).push(g)}}}
function geodeAt(c,r){const L=geodes.get(Math.floor(c/16)+','+Math.floor(r/16));if(!L)return null;
 for(const g of L){const d=Math.hypot(c-g.c,(r-g.r)/g.sq)+(hash(c,r,205)-.5)*.5;if(d<g.R){
  if(d<g.R-2.6)return 'geode_air';if(d<g.R-1.6)return 'amethyst_block';if(d<g.R-.8)return 'calcite';return 'smooth_basalt'}}return null}
// Caverna (ar) neste bloco?
function caveAt(c,r,y){if(y>54||y<-61)return false;const top=clamp01((54-y)/10);
 if(fbm(c/22,r/13,301)*top>CFG.CHEESE)return true;
 return Math.abs(fbm(c/28,r/24,302)-.5)<CFG.SPAGHETTI*top}
// Aquíferos: cada região tem um nível de fluido; abaixo dele a caverna fica cheia
function fluidAt(c,r,y){const RW=30,RH=20,gx=Math.floor(c/RW),gy=Math.floor(r/RH);
 const level=gy*RH+Math.floor(hash(gx,gy,402)*RH*.8),lava=yOf(level)<CFG.LAVA_Y; // tipo decidido pelo nível da região: nunca água sobre lava
 if(hash(gx,gy,401)>(lava?.7:CFG.FLOOD))return null;return r>=level?(lava?'lava':'water'):null}
const lushAt=(c,r,y)=>y<50&&y>-40&&fbm(c/55,r/38,501)>CFG.LUSH;
function baseAt(c,r,y){
 if(r<CFG.DIRT_DEPTH+Math.floor(hash(c,0,601)*2))return 'dirt';
 const deep=y<0||(y<CFG.DEEPSLATE_MIX&&hash(c,r,602)<(CFG.DEEPSLATE_MIX-y)/CFG.DEEPSLATE_MIX);
 const b=CFG.BLOBS,blob=(s)=>fbm(c/9,r/7,s)>b;
 if(!deep){if(blob(611))return 'granite';if(blob(612))return 'diorite';if(blob(613))return 'andesite';if(fbm(c/8,r/6,614)>b+.04)return 'dirt'}
 else if(blob(615))return 'tuff';
 if(fbm(c/7,r/6,616)>b+.05)return 'gravel';
 return deep?'deepslate':'stone'}
// Bloco final da célula: {t: textura, bg: textura de fundo da caverna (ou null), dark}
function cell(c,r){
 const y=yOf(r);
 if(hashBed(c,r,y))return{t:'bedrock'};
 const g=geodeAt(c,r);if(g)return g==='geode_air'?{bg:'amethyst_block',dark:.55}:{t:g};
 const deep=y<0,host=deep?'deepslate':'stone';
 if(caveAt(c,r,y)){
  const f=fluidAt(c,r,y);if(f)return f==='lava'?{t:'lava'}:{bg:host,t:'water',alpha:CFG.WATER_ALPHA};
  // Cipós pendurados no teto das cavernas de musgo
  if(lushAt(c,r,y)){for(let k=1;k<=5;k++){if(!caveAt(c,r-k,yOf(r-k))){const len=1+Math.floor(hash(c,r-k,701)*5);if(k<=len&&hash(c,r-k,702)<.55)return{bg:host,t:'cave_vines'};break}}}
  return{bg:host}}
 const lush=lushAt(c,r,y);
 if(lush){const below=caveAt(c,r+1,yOf(r+1)),above=caveAt(c,r-1,yOf(r-1));
  if(below||above||caveAt(c-1,r,y)||caveAt(c+1,r,y))return{t:hash(c,r,703)<.12?'clay':'moss_block'};}
 const b=baseAt(c,r,y);
 if(b==='stone'||b==='deepslate'){const o=oreAt(c,r,y);if(o)return{t:(b==='deepslate'?'deepslate_':'')+o+'_ore'}}
 return{t:b}}
const hashBed=(c,r,y)=>y<=-63.5||(y<-59.5&&hash(c,r,801)<(-59.5-y)/4);

// ── Desenho em pedaços (canvas), só quando chega perto da tela ──
const host=document.createElement('div');host.id='mcWorld';host.setAttribute('aria-hidden','true');document.body.prepend(host);
const IMG={};let ready=Promise.all(Object.entries(TEX).map(([k,src])=>new Promise(res=>{const i=new Image();i.onload=res;i.onerror=res;i.src=src;IMG[k]=i})));
let io=null,lastKey='';
function build(){
 const top=hero.getBoundingClientRect().bottom+scrollY,bottom=wrap.getBoundingClientRect().bottom+scrollY;
 const W=document.documentElement.clientWidth,H=Math.max(0,bottom-top),T=CFG.TILE,cols=Math.ceil(W/T);rows=Math.ceil(H/T);
 const key=cols+'x'+rows;if(key===lastKey)return;lastKey=key;
 Object.assign(host.style,{top:top+'px',height:H+'px'});
 host.style.setProperty('--dim-top',CFG.DIM_TOP);host.style.setProperty('--dim-bottom',CFG.DIM_BOTTOM);
 yOf=r=>CFG.Y_TOP-r*(CFG.Y_TOP-CFG.Y_BOTTOM)/Math.max(1,rows-1);
 placeGeodes(cols);
 io&&io.disconnect();host.querySelectorAll('canvas').forEach(c=>c.remove());
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);draw(e.target)}}),{rootMargin:'1200px 0px'});
 for(let r0=0;r0<rows;r0+=CFG.CHUNK_ROWS){const n=Math.min(CFG.CHUNK_ROWS,rows-r0),cv=document.createElement('canvas');
  cv.width=cols*16;cv.height=n*16;cv.dataset.r0=r0;Object.assign(cv.style,{top:r0*T+'px',width:cols*T+'px',height:n*T+'px'});host.append(cv);io.observe(cv)}
 host.cols=cols}
function draw(cv){ready.then(()=>{
 const g=cv.getContext('2d'),r0=+cv.dataset.r0,n=cv.height/16,cols=host.cols;g.imageSmoothingEnabled=false;
 for(let rr=0;rr<n;rr++)for(let c=0;c<cols;c++){const b=cell(c,r0+rr),x=c*16,y=rr*16;
  if(b.bg){g.drawImage(IMG[b.bg],x,y);g.fillStyle=`rgba(6,8,14,${b.dark??CFG.CAVE_DARK})`;g.fillRect(x,y,16,16)}
  if(b.t){g.globalAlpha=b.alpha??1;g.drawImage(IMG[b.t],x,y);g.globalAlpha=1}}})}
let to=0;const sched=()=>{clearTimeout(to);to=setTimeout(build,250)};
build();new ResizeObserver(sched).observe(wrap);addEventListener('resize',sched);
})();
</script>
